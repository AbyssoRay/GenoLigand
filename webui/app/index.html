<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenoLigand</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand">
          <div class="mark">GL</div>
          <div>
            <strong>GenoLigand</strong>
            <span>靶点发现科研工作台</span>
          </div>
        </div>
        <nav class="steps" aria-label="工作流程">
          <button data-step="input" class="step active">输入</button>
          <button data-step="configure" class="step">配置</button>
          <button data-step="check" class="step">检查</button>
          <button data-step="run" class="step">运行</button>
          <button data-step="results" class="step">结果</button>
          <button data-step="export" class="step">导出</button>
        </nav>
        <div class="side-status">
          <span data-health class="status-pill loading">连接中</span>
          <span data-project-pill class="muted">未创建项目</span>
        </div>
      </aside>
      <main class="main">
        <header class="top">
          <div>
            <h1 data-title>输入研究对象</h1>
            <p data-subtitle>填写任一种研究输入，然后按流程检查、运行、查看结果。</p>
          </div>
          <div class="top-actions">
            <button class="button ghost" data-refresh>刷新状态</button>
          </div>
        </header>
        <section data-alerts></section>
        <section data-page class="page loading-state">
          <div class="spinner"></div>
          <p>正在读取本机状态...</p>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>

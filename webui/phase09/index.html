<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenoLigand 0.9.1</title>
    <link rel="stylesheet" href="/styles.css?v=0.9.1-pipeline" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="GenoLigand navigation">
        <div class="brand">
          <div class="brand-mark">GL</div>
          <div>
            <strong>GenoLigand</strong>
            <span data-i18n="brandSubtitle">本地科研工作台</span>
          </div>
        </div>
        <nav data-nav></nav>
        <div class="sidebar-footer">
          <span class="status ready" data-i18n="versionBadge">0.9.1 正式版</span>
          <span data-i18n="backendNote">本地科研工作台已就绪</span>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <strong data-top-project>GenoLigand 0.9.1</strong>
            <span data-top-run>本地工作台已就绪 / 等待项目</span>
          </div>
          <div class="top-actions">
            <span class="status ready" data-server-state>READY</span>
            <button data-lang-toggle type="button">中文 / EN</button>
          </div>
        </header>

        <main class="main-grid">
          <section class="main-panel">
            <div class="page-header">
              <div>
                <span class="eyeless" data-page-kicker>GenoLigand 0.9.1</span>
                <h1 data-page-title>本地工作台</h1>
                <p data-page-description>通过浏览器完成项目、输入、运行、结果、报告和诊断。</p>
              </div>
              <span class="status ready" data-page-status>READY</span>
            </div>
            <div class="grid" data-main></div>
          </section>

          <aside class="detail-panel" aria-label="Page details" data-detail></aside>
        </main>

        <section class="log-strip" aria-label="Run log">
          <div class="timeline" data-runtime-timeline></div>
          <pre data-runtime-log>GenoLigand 0.9.1 本地工作台已就绪。当前浏览器会话尚未绑定运行。请创建或打开项目，完成预检查后启动任务。</pre>
        </section>
      </section>
    </div>
    <script src="/app.js?v=0.9.1-pipeline"></script>
  </body>
</html>

self_control:
  description: "External RCSB structure searched against the same reference structure database."
  expected_foldseek_top_hit: "self"
  min_usalign_tm_score: 0.95

homolog_positive_control:
  description: "Top non-self Foldseek hit for the self-control query, confirmed by US-align."
  min_usalign_tm_score: 0.70

negative_structure_control:
  description: "Two deterministic unrelated RCSB structures from opposite ends of the reference subset."
  max_usalign_tm_score: 0.40

positive_patch_control:
  description: "A BioLiP2 binding patch matched against the same reference patch."
  min_patch_similarity: 0.75

negative_patch_control:
  description: "A deterministic unrelated reference patch pair."
  max_patch_similarity: 0.50

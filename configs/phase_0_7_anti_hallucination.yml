missing_values_allowed:
  - missing
  - not_applicable
  - not_run
  - tool_incompatible
  - parse_failed
  - validation_failed
forbidden_missing_values:
  - unknown
  - N/A
  - NA
  - placeholder
  - mock
  - synthetic
  - estimated
  - likely
  - probably
forbidden_report_terms:
  - validated target
  - confirmed target
  - true target
  - proved binding
  - binding affinity
  - free energy
  - mechanism of action
  - biological activity
  - therapeutic effect
  - experimental validation
  - discovered target
  - definitive target
controlled_report_terms:
  - possible target
  - candidate target
  - target-prior
  - interaction
  - hydrogen bond
  - salt bridge
  - docking score
  - binding patch
  - pocket
  - redocking
  - RMSD
placeholder_patterns:
  - TODO
  - TBD
  - placeholder
  - fake
  - mock result
  - dummy result
  - lorem ipsum
  - example only
  - not implemented
  - hardcoded pass
  - synthetic docking

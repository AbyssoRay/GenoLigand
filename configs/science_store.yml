science_store:
  default_root_env: GENOLIGAND_SCIENCE_STORE
  required_manifests:
    - science_store_manifest.tsv
    - indexes/known_targets.tsv
    - indexes/metagenome_targets.tsv
    - indexes/tool_versions.tsv
  known_database_sources:
    - ChEMBL
    - BindingDB
    - UniProt
    - RCSB
    - BioLiP2
    - PLINDER
    - Binding MOAD
  metagenome_sources:
    - public_metagenome_protein_index
    - microbial_protein_index
    - unannotated_orf_index
    - predicted_structure_index
  installation_policy:
    user_supplies_database_paths: false
    advanced_mode_can_rebuild: true
    missing_required_resource_behavior: block_without_candidates
    candidate_generation_without_user_input: false
    candidate_generation_without_store: false

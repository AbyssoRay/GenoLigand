rcsb:
  source_name: "RCSB PDB"
  api_docs: "https://www.rcsb.org/docs/programmatic-access/web-apis-overview"
  file_url_template: "https://files.rcsb.org/download/{pdb_id}.pdb"
  min_entries: 200
  preferred_entries: 500

biolip2:
  source_name: "BioLiP2"
  download_page: "https://zhanggroup.org/BioLiP/download.html"
  annotation_url: "https://zhanggroup.org/BioLiP/download/BioLiP.txt.gz"
  readme_url: "https://zhanggroup.org/BioLiP/download/readme.txt"
  min_interactions: 500
  preferred_interactions: 2000

afdb:
  source_name: "AlphaFold DB"
  enabled_by_default: false
  download_docs: "https://alphafold.ebi.ac.uk/download"

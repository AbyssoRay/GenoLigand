phase: "0.5"
acceptance_mode: "gpu_strict"

inputs:
  phase_0_4_artifact_dir: "acceptance_artifacts_phase_0_4"
  candidate_fasta: "acceptance_artifacts_phase_0_4/outputs/candidates/candidate_orfs.fasta"
  candidate_tsv: "acceptance_artifacts_phase_0_4/outputs/candidates/candidate_orfs.tsv"
  sequence_features: "acceptance_artifacts_phase_0_4/outputs/sequence_features/sequence_features.tsv"
  sequence_evidence: "acceptance_artifacts_phase_0_4/outputs/sequence_evidence/sequence_evidence.tsv"
  similarity_hits: "acceptance_artifacts_phase_0_4/outputs/similarity/similarity_hits.tsv"
  similarity_summary: "acceptance_artifacts_phase_0_4/outputs/similarity/similarity_summary.tsv"

cuda:
  cuda_home: "D:\\Program Files\\CUDA"
  nvcc: "D:\\Program Files\\CUDA\\bin\\nvcc.exe"
  required: true
  min_device_count: 1
  required_cuda_tensor_test: true
  require_nvcc: true
  reject_cpu_only_torch: true
  reject_cpu_fallback_for_required_steps: true
  gpu_memory_probe: true
  preferred_device: "cuda:0"

plm:
  required: true
  backend_priority:
    - "fair_esm_gpu"
    - "huggingface_esm_gpu"
  model_id: "esm2_t6_8M_UR50D"
  required_device: "cuda"
  batch_size: 4
  max_sequence_length: 1024
  deterministic_eval: true

structure:
  required: true
  backend_priority:
    - "esmfold_hf_gpu"
    - "esmfold_native_gpu"
    - "colabfold_gpu"
  model_id: "facebook/esmfold_v1"
  required_device: "cuda"
  required_output_format:
    - "pdb"
  max_candidates_for_acceptance: 11
  include_decoys: true
  min_required_structures: 6
  mandatory_candidate_ids:
    - "p03_k1_cds_001"
    - "p03_k2_alt_frame_001"
  mandatory_decoy_ids:
    - "p03_d1_low_complexity_001"
    - "p04_d3_shuffled_p03_k1_cds_001"
    - "p04_d4_reversed_p03_k1_cds_001"
    - "p04_d5_random_matched_length_001"
  fail_if_required_structure_missing: true

quality:
  plddt_from_bfactor: true
  require_mean_plddt: true
  require_low_confidence_fraction: true
  require_radius_of_gyration: true
  require_ca_graph: true
  require_secondary_structure_summary: false
  plddt_warn_threshold: 50.0
  plddt_fail_threshold: null

patches:
  required: true
  ca_radius_angstrom: 8.0
  min_patch_residues: 3
  include_physicochemical_counts: true
  include_geometry: true

nextflow:
  gpu_profile_required: true
  accelerator_directive_required: true
  gpu_self_check_process_required: true
  structure_process_gpu_required: true
  trace_required: true
  resume_hash_required: true
